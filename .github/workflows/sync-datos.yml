# Sincroniza solo los datos de las películas: corre los scripts de cerebro/
# (TMDB + recomendador + perfil de gusto) y, si algo cambió, lo commitea.
# El sitio lee estos JSON directo del repo, así que las películas nuevas
# aparecen con póster, reparto, duración y sinopsis sin correr nada a mano.
# Sin Make. Necesita el secreto TMDB_TOKEN (Settings → Secrets → Actions).
name: Sincronizar datos de películas

on:
  schedule:
    - cron: "0 10 * * *" # todos los días, 07:00 de Argentina
  workflow_dispatch: {} # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: sync-datos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: cerebro/requirements.txt

      - name: Dependencias de Python
        run: pip install -r cerebro/requirements.txt

      - name: Clave de TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then echo "::error::Falta el secreto TMDB_TOKEN"; exit 1; fi
          printf '%s' "$TMDB_TOKEN" > cerebro/tmdb.key

      - name: TMDB (pósters, reparto, duración, sinopsis)
        run: |
          node cerebro/build_posters.js
          node cerebro/build_actors.js
          node cerebro/build_runtime.js
          node cerebro/build_synopsis.js

      - name: Perfil de gusto y recomendador
        run: |
          python cerebro/taste_profile.py
          python cerebro/build_similar.py
          python cerebro/build_similar_ajustado.py

      - name: Commit si hubo cambios
        run: |
          rm -f cerebro/tmdb.key
          git add posters.json actors.json runtime.json synopsis.json similar.json similar_ajustado.json taste_profile.json
          if git diff --cached --quiet; then
            echo "Sin cambios: no hay películas nuevas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Datos: sincronización automática ($(date -u +%Y-%m-%d))"
          git push
