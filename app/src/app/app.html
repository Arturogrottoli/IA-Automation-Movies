<header class="masthead">
  <app-hero-backdrop />
  <button class="theme-btn" aria-label="Cambiar tema" (click)="theme.toggle()">◑</button>
  <div class="wrap">
    <div class="eyebrow">
      <span>Registro personal</span><span>·</span><span>{{ eyebrowRange() }}</span><span>·</span><span>{{ eyebrowFeed() }}</span>
    </div>
    <h1>Diario de<br />proyección</h1>
    <p class="lede">
      Cada película que vi desde enero de 2018, anotada el día que la vi. Esto es
      lo que se ve cuando se apila todo.
    </p>
    <nav class="sections" aria-label="Secciones">
      <a routerLink="/" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <span class="sections-name">Películas</span>
        <span class="sections-desc">índice, listas, búsquedas</span>
      </a>
      <a routerLink="/datos" routerLinkActive="on" ariaCurrentWhenActive="page">
        <span class="sections-name">Datos</span>
        <span class="sections-desc">gráficos y machine learning</span>
      </a>
    </nav>
  </div>
</header>
<div class="perf" aria-hidden="true"></div>

<app-vitals-strip />

<main>
  <router-outlet />
</main>

<app-footer />

<app-movie-detail-dialog />
<app-confirm-dialog />
<app-chart-tooltip />
<app-toast />
<app-actor-dialog />
<app-movie-bot />
