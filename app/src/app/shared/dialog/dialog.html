@if (open()) {
  <div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="modal" [class.modal-confirm]="compact()" role="dialog" aria-modal="true">
      @if (showCloseButton()) {
        <button class="modal-close" aria-label="Cerrar" (click)="closed.emit()">✕</button>
      }
      <ng-content />
    </div>
  </div>
}
